[package]
name = "ntsc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for the NTSC (Neutron Type-Safe Compiler)"

[[bin]]
name = "ntsc"
path = "src/main.rs"

[dependencies]
ntsc-ast = { path = "../ntsc-ast" }
ntsc-lexer = { path = "../ntsc-lexer" }
ntsc-parser = { path = "../ntsc-parser" }
ntsc-build = { path = "../ntsc-build" }
ntsc-codegen = { path = "../ntsc-codegen" }
ntsc-typeck = { path = "../ntsc-typeck" }
ntsc-diag = { path = "../ntsc-diag" }
ntsc-cargo = { path = "../ntsc-cargo" }
ntsc-lsp = { path = "../ntsc-lsp" }
ratatui = "0.29"
pulldown-cmark = { version = "0.13", default-features = false }
inkwell = { git = "https://github.com/TheDan64/inkwell", rev = "3cf0506a4167f149b8fb56fb9714571f927a2306", default-features = false, features = ["target-x86", "target-aarch64"] }

[target.'cfg(target_env = "msvc")'.dependencies]
inkwell = { git = "https://github.com/TheDan64/inkwell", rev = "3cf0506a4167f149b8fb56fb9714571f927a2306", default-features = false, features = ["llvm23-1-no-llvm-linking"] }

[target.'cfg(not(target_env = "msvc"))'.dependencies]
inkwell = { git = "https://github.com/TheDan64/inkwell", rev = "3cf0506a4167f149b8fb56fb9714571f927a2306", default-features = false, features = ["llvm23-1-force-dynamic"] }

[target.'cfg(unix)'.dependencies]
# Restores SIGPIPE's default handler when output is piped into head or less.
libc = "0.2"
