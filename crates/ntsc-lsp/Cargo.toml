[package]
name = "ntsc-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Language server (LSP) for the Neutron (NTSC) programming language"

[[bin]]
name = "ntsc-lsp"
path = "src/main.rs"

[dependencies]
ntsc-ast = { path = "../ntsc-ast" }
ntsc-lexer = { path = "../ntsc-lexer" }
ntsc-parser = { path = "../ntsc-parser" }
ntsc-diag = { path = "../ntsc-diag" }
ntsc-typeck = { path = "../ntsc-typeck" }
lsp-server = "0.7"
lsp-types = "0.94"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
lsp-server = "0.7"
