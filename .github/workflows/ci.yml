name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Allow other workflows (e.g. release) to invoke this suite as a gate,
  # so tagged builds run the exact same build/lint/test as normal CI.
  workflow_call:

env:
  LLVM_VERSION: 23.1.3
  # Dropping debug info and incremental state keeps the Linux runner (14 GB
  # disk) from filling up while the e2e binaries use the shared LLVM library.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest has a 14 GB disk, so reclaim the preinstalled SDKs
      # (Android, .NET, Haskell, CodeQL, Docker images) before downloading LLVM.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo docker builder prune -af >/dev/null 2>&1 || true
          df -h /

      # ── LLVM 23 ──────────────────────────────────────────────────────────
      # The codegen crate links against LLVM 23 via llvm-sys 231. Each host
      # needs an LLVM 23 with bin/llvm-config available at LLVM_SYS_231_PREFIX.
      - name: Install LLVM 23 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/LLVM-${{ env.LLVM_VERSION }}-Linux-X64.tar.xz"
          mkdir -p "$HOME/llvm"
          tar -xf llvm.tar.xz -C "$HOME/llvm" --strip-components=1
          rm -f llvm.tar.xz
          # Only llvm-config (llvm-sys), the shared libLLVM, and the headers are
          # needed to build and link. Drop the ~3.5 GB of tools/docs nothing
          # here invokes so `cargo test` does not fill the runner disk.
          rm -rf "$HOME/llvm/libexec" "$HOME/llvm/share"
          rm -rf "$HOME/llvm/lib/clang" "$HOME/llvm/lib/cmake"
          find "$HOME/llvm/bin" -mindepth 1 -maxdepth 1 ! -name 'llvm-config*' -exec rm -rf {} +
          # Sanity check that llvm-sys can still find and run llvm-config.
          "$HOME/llvm/bin/llvm-config" --version
          echo "LLVM_SYS_231_PREFIX=$HOME/llvm" >> "$GITHUB_ENV"
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"

      - name: Install LLVM 23 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@23
          echo "LLVM_SYS_231_PREFIX=$(brew --prefix llvm@23)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@23)/bin" >> "$GITHUB_PATH"

      # The win64 .exe installer is an NSIS stub whose child process can
      # outlive Start-Process -Wait, and it ships neither llvm-config.exe nor
      # the development libraries. Use the clang+llvm archive instead, which
      # is the package for projects that link against LLVM and contains
      # include/, lib/, bin/llvm-config.exe, and the DLLs.
      - name: Install LLVM 23 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/clang+llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc.tar.xz" -OutFile llvm.tar.xz
          tar -xf llvm.tar.xz
          Remove-Item llvm.tar.xz
          $llvm = Join-Path $pwd "clang+llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc"
          "LLVM_SYS_231_PREFIX=$llvm" >> $env:GITHUB_ENV
          "$llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # The MSVC toolchain provides link.exe for the e2e runtime linking.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ── Rust toolchain ───────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # ── Gate ─────────────────────────────────────────────────────────────
      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        # ntsc-runtime's registry keeps one process-global live-handle
        # counter; its unit tests assert reclamation against that global,
        # so they must not interleave with each other under the default
        # parallel harness (the race intermittently broke CI).
        run: |
          cargo test --workspace --exclude ntsc-runtime
          cargo test -p ntsc-runtime -- --test-threads=1

      # ── Smoke test: scaffold + build + run a project ─────────────────────
      # Runs under pwsh like every other step: a bash shell prepends the Git
      # /usr/bin dir to PATH, and its coreutils link.exe would shadow the
      # MSVC linker for the child ntsc process.
      - name: Smoke test init
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build -p ntsc-cli --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Exact path: a name glob could pick up the ntsc.d depfile.
          $exe = if ($IsWindows) { "ntsc.exe" } else { "ntsc" }
          $cli = Join-Path $pwd "target/release/$exe"
          if (-not (Test-Path $cli)) {
            Get-ChildItem "target/release" | Out-String | Write-Host
            throw "ntsc binary not found in target/release"
          }
          $tmp = Join-Path ([IO.Path]::GetTempPath()) "ntsc-smoke-$([Guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory $tmp | Out-Null
          Push-Location $tmp
          try {
            & $cli init hello
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Push-Location hello
            try {
              & $cli --version
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $out = (& $cli run --release 2>&1) | ForEach-Object { "$_" }
              $out | Write-Host
              if ($LASTEXITCODE -ne 0) { throw "::error::ntsc run --release exited with $LASTEXITCODE" }
              if (-not (($out | Out-String) -match "Hello, World!")) {
                throw "unexpected output from hello world"
              }
            } finally { Pop-Location }
          } finally { Pop-Location }

      - name: Smoke test package manager
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = if ($IsWindows) { "ntsc.exe" } else { "ntsc" }
          $cli = Join-Path $pwd "target/release/$exe"
          Push-Location "crates/ntsc-pkg"
          try {
            & $cli build --release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $pkgName = if ($IsWindows) { "ntsc-pkg.exe" } else { "ntsc-pkg" }
            $pkg = Join-Path $pwd "build/release/$pkgName"
            if (-not (Test-Path $pkg)) { throw "ntsc-pkg binary not produced" }
            & $pkg
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }

      # The manager shells out to `git`, so the full install/build/update
      # cycle runs on the Unix runners only.
      - name: Package manager end-to-end
        if: runner.os != 'Windows'
        run: |
          cp crates/ntsc-pkg/build/release/ntsc-pkg target/release/ntsc-pkg
          ./scripts/test-pkg.sh
