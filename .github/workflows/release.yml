name: release

# Builds and attaches installers to a GitHub Release when a version tag
# (`v26.0.0b`, ...) is pushed. Each runner builds the `ntsc` release binary
# against LLVM 22 and packages it for its platform:
#
#   Linux   -> .deb (Debian/Ubuntu), .rpm (Fedora/RHEL), PKGBUILD (Arch source)
#              + a prebuilt Arch package (.pkg.tar.zst, `pacman -U`), plus a
#              self-contained .tar.gz (LLVM + runtime bundled)
#   macOS   -> .dmg application bundle (LLVM dylibs bundled), plus a
#              self-contained .tar.gz
#   Windows -> .msi installer (LLVM DLLs bundled, optional Add-to-PATH toggle
#              in the feature-selection dialogs, ld.lld + MinGW import
#              libraries + GNU runtime bundled so linking needs no MSVC/gcc),
#              plus a self-contained .tar.gz
#
# The native packages link LLVM 22 dynamically and declare a runtime
# dependency on the system LLVM (libLLVM-22 / llvm-libs). The .tar.gz archives
# instead bundle the LLVM libraries and the ntsc runtime, so they run with no
# LLVM install and no toolchain. Every package ships libntsc_runtime.a, the
# static archive `ntsc build` links NTSC programs against.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (e.g. 26.0.0b). Defaults to the pushed tag."
        required: false

permissions:
  contents: write

env:
  # ── RELEASE SWITCHES (consumed by the `config` job below) ──────────────────
  # These control what a release run does. They live here as plain env values
  # so they are easy to flip; the `config` job turns them into a job condition
  # and a build matrix, because env cannot be read from a job `if:` or matrix.
  #
  #   RUN_TESTS     "true"  -> run the full CI gate (build+lint+test ×3 OSes)
  #                 "false" -> skip it (fast iteration on the installer)
  #   WINDOWS_ONLY  "true"  -> package only the Windows .msi + .tar.gz
  #                 "false" -> also package Linux (.deb/.rpm/PKGBUILD/.tar.gz)
  #                            + macOS (.dmg/.tar.gz)
  RUN_TESTS: "true"
  WINDOWS_ONLY: "false"

  LLVM_VERSION: 22.1.6
  # Pinned so release builds are reproducible; the UI extension registered
  # below must match this exact version.
  WIX_VERSION: 5.0.2
  # The ntsc release binary links LLVM and is large. Together with the LLVM
  # trimming and free-disk-space steps below, dropping incremental state keeps
  # the Linux runner (14 GB disk) from filling up during the release build.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Resolve the RUN_TESTS / WINDOWS_ONLY switches into values that a job `if:`
  # and a build matrix can actually read. Workflow `env` is visible to step
  # shells but NOT to job conditions or `strategy.matrix`, so this job reads
  # them in a step and republishes them as job outputs (which `needs.*` exposes
  # to both). The matrix is emitted as a JSON string for `fromJSON` below.
  config:
    name: config
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.flags.outputs.run_tests }}
      matrix: ${{ steps.flags.outputs.matrix }}
    steps:
      - id: flags
        shell: bash
        run: |
          # printf '%s' never interprets backslashes; jq guarantees valid JSON
          # escaping (the Linux artifacts glob is newline-separated -> "\n").
          printf 'run_tests=%s\n' "${RUN_TESTS}" >> "$GITHUB_OUTPUT"

          win='{"name":"windows-x86_64","os":"windows-latest","artifacts":"dist/*.msi\ndist/*.tar.gz"}'
          lin='{"name":"linux-x86_64","os":"ubuntu-latest","artifacts":"*.deb\n*.rpm\nPKGBUILD\ndist/*.tar.gz\ndist/*.pkg.tar.zst"}'
          mac='{"name":"macos-aarch64","os":"macos-latest","artifacts":"dist/*.dmg\ndist/*.tar.gz"}'
          if [ "${WINDOWS_ONLY}" = "true" ]; then
            matrix=$(jq -cn --argjson w "$win" '{include:[$w]}')
          else
            matrix=$(jq -cn --argjson l "$lin" --argjson m "$mac" --argjson w "$win" \
              '{include:[$l,$m,$w]}')
          fi
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  # Gate: run the full CI suite (build + lint + test on all three OSes) before
  # packaging anything, so a tag can never ship binaries from a tree that does
  # not pass tests. Reuses ci.yml verbatim — no duplicated LLVM/MSVC setup.
  # Skipped entirely when RUN_TESTS is not "true".
  test:
    name: gate (ci)
    needs: config
    if: needs.config.outputs.run_tests == 'true'
    uses: ./.github/workflows/ci.yml

  build:
    name: package-${{ matrix.name }}
    needs: [config, test]
    # Run once `config` is ready and the test gate is satisfied. `always()` is
    # required so a *skipped* `test` (RUN_TESTS=false) still lets build run;
    # without it, build would be skipped too. The gate is mode-aware:
    #   - config must have succeeded (so the matrix is valid), and
    #   - if tests are ENABLED, test must have actually SUCCEEDED — a test job
    #     that failed OR was unexpectedly skipped must block the release;
    #   - if tests are DISABLED (run_tests != 'true'), test's skipped state is
    #     fine and build proceeds.
    # Keying off `== 'success'` (rather than `!= 'failure'`) closes the gap
    # where a test skipped for some *other* reason while enabled would ship
    # untested binaries.
    if: >-
      always() &&
      needs.config.result == 'success' &&
      (needs.config.outputs.run_tests != 'true' || needs.test.result == 'success')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest has a 14 GB disk; the ntsc release binary statically
      # links LLVM, so reclaim the preinstalled toolchains (Android SDK, .NET,
      # Haskell, CodeQL, Docker images) that nothing in this workflow needs.
      - name: Disk usage before cleanup (Linux)
        if: runner.os == 'Linux'
        run: df -h

      - name: node-cleanup (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Disk usage after cleanup (Linux)
        if: runner.os == 'Linux'
        run: df -h

      # ── LLVM 22 ──────────────────────────────────────────────────────────
      - name: Install LLVM 22 (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o llvm.tar.xz "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/LLVM-${{ env.LLVM_VERSION }}-Linux-X64.tar.xz"
          tar -xf llvm.tar.xz
          mv LLVM-*-Linux-X64 "$HOME/llvm"
          rm -f llvm.tar.xz
          # Only llvm-config (llvm-sys), the static libs, the headers, and the
          # shared libLLVM are needed to build and link. Drop the ~3.5 GB of
          # tools/docs nothing here invokes so the 14 GB runner disk has room
          # for the release build and the packaging tools.
          rm -rf "$HOME/llvm/libexec" "$HOME/llvm/share"
          rm -rf "$HOME/llvm/lib/clang" "$HOME/llvm/lib/cmake"
          find "$HOME/llvm/bin" -mindepth 1 -maxdepth 1 ! -name 'llvm-config*' -exec rm -rf {} +
          # Sanity check that llvm-sys can still find and run llvm-config.
          "$HOME/llvm/bin/llvm-config" --version
          echo "LLVM_SYS_221_PREFIX=$HOME/llvm" >> "$GITHUB_ENV"
          echo "$HOME/llvm/bin" >> "$GITHUB_PATH"

      - name: Install LLVM 22 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22
          echo "LLVM_SYS_221_PREFIX=$(brew --prefix llvm@22)" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"

      # The win64 .exe installer is an NSIS stub whose child process can
      # outlive Start-Process -Wait, so the build sometimes found no LLVM. Use
      # the clang+llvm archive instead, which is the package for projects
      # that link against LLVM (include/, lib/, and the DLLs, plus lld).
      - name: Install LLVM 22 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/clang+llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc.tar.xz" -OutFile llvm.tar.xz
          tar -xf llvm.tar.xz
          Remove-Item llvm.tar.xz
          $llvm = Join-Path $pwd "clang+llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc"
          "LLVM_SYS_221_PREFIX=$llvm" >> $env:GITHUB_ENV
          "LLVM_BIN=$llvm\bin" >> $env:GITHUB_ENV
          "$llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      # The MSVC toolchain provides link.exe for the e2e runtime linking.
      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # The official clang+llvm Windows archive is built with
      # LLVM_ENABLE_LIBXML2=FORCE_ON against a static libxml2, but the archive
      # does not ship it: llvm-config --system-libs reports xml2s.lib, so
      # statically linking LLVM fails with LNK1181. Build the same minimal
      # static libxml2 (v2.9.12) that LLVM's own release script builds and
      # drop it into the LLVM lib dir under the names the linker wants.
      - name: Provide libxml2 static library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Fail fast on native command failures (curl/tar/cmake).
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $libxmlVersion = "2.9.12"
          $tarball = "libxml2-v$libxmlVersion.tar.gz"
          curl.exe -fsSL -o $tarball "https://gitlab.gnome.org/GNOME/libxml2/-/archive/v$libxmlVersion/$tarball"
          $hash = (Get-FileHash $tarball -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "98bfa7a9a5e2a75638422050740448ee9f02bf4dc2075c9822d7747d5ff9e617") {
            throw "libxml2 checksum mismatch: $hash"
          }
          tar -xzf $tarball
          # The LLVM package's bin dir is on PATH, so CMake's Ninja generator
          # picks its native clang.exe over cl.exe. That compiler treats MSVC
          # differently (CMake's MSVC flag is false), so libxml2's xmlIO.c
          # fails with undeclared read/write/close/getcwd. Pin the MSVC
          # compiler, and build with /MD so the static objects match the CRT
          # of the Rust test binaries (avoids the LNK4098 libcmt/msvcrt
          # conflict; LLVM's own release script uses /MT for its own tools).
          # NOTE: keep comment lines OUT of the backtick-continued command.
          cmake -GNinja -S "libxml2-v$libxmlVersion" -B libxml2-build `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=libxml2-install `
            -DBUILD_SHARED_LIBS=OFF `
            -DLIBXML2_WITH_C14N=OFF -DLIBXML2_WITH_CATALOG=OFF `
            -DLIBXML2_WITH_DEBUG=OFF -DLIBXML2_WITH_DOCB=OFF `
            -DLIBXML2_WITH_FTP=OFF -DLIBXML2_WITH_HTML=OFF `
            -DLIBXML2_WITH_HTTP=OFF -DLIBXML2_WITH_ICONV=OFF `
            -DLIBXML2_WITH_ICU=OFF -DLIBXML2_WITH_ISO8859X=OFF `
            -DLIBXML2_WITH_LEGACY=OFF -DLIBXML2_WITH_LZMA=OFF `
            -DLIBXML2_WITH_MEM_DEBUG=OFF -DLIBXML2_WITH_MODULES=OFF `
            -DLIBXML2_WITH_OUTPUT=ON -DLIBXML2_WITH_PATTERN=OFF `
            -DLIBXML2_WITH_PROGRAMS=OFF -DLIBXML2_WITH_PUSH=OFF `
            -DLIBXML2_WITH_PYTHON=OFF -DLIBXML2_WITH_READER=OFF `
            -DLIBXML2_WITH_REGEXPS=OFF -DLIBXML2_WITH_RUN_DEBUG=OFF `
            -DLIBXML2_WITH_SAX1=ON -DLIBXML2_WITH_SCHEMAS=OFF `
            -DLIBXML2_WITH_SCHEMATRON=OFF -DLIBXML2_WITH_TESTS=OFF `
            -DLIBXML2_WITH_THREADS=ON -DLIBXML2_WITH_THREAD_ALLOC=OFF `
            -DLIBXML2_WITH_TREE=ON -DLIBXML2_WITH_VALID=OFF `
            -DLIBXML2_WITH_WRITER=OFF -DLIBXML2_WITH_XINCLUDE=OFF `
            -DLIBXML2_WITH_XPATH=OFF -DLIBXML2_WITH_XPTR=OFF `
            -DLIBXML2_WITH_ZLIB=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
          cmake --build libxml2-build
          cmake --install libxml2-build
          $lib = Get-ChildItem -Recurse -Filter *.lib libxml2-install | Select-Object -First 1
          if (-not $lib) { throw "libxml2 static library was not built" }
          $llvmLib = Join-Path $env:LLVM_SYS_221_PREFIX "lib"
          # llvm-config reports the name without the lib prefix; install both
          # spellings so link.exe finds the library either way.
          Copy-Item $lib.FullName (Join-Path $llvmLib "xml2s.lib") -Force
          Copy-Item $lib.FullName (Join-Path $llvmLib "libxml2s.lib") -Force

      # ── Rust ─────────────────────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Invalidate the cache whenever the Windows linker/CRT settings
          # change, so stale link.exe-linked artifacts are never reused.
          key: toolchain-${{ hashFiles('.cargo/config.toml') }}

      - name: Build release binary
        run: cargo build -p ntsc-cli --release

      # ntsc-cli links ntsc-lsp as a library for `ntsc lsp`, but cargo only
      # builds a dependency's library, so the editor-facing binary needs its
      # own build step to be packaged next to ntsc.
      - name: Build language server
        run: cargo build -p ntsc-lsp --release

      # The Unix packages and tarballs ship libntsc_runtime.a — the static
      # archive `ntsc build` links NTSC programs against. ntsc-cli does not
      # depend on ntsc-runtime, so it is not built as a side effect. Windows
      # builds its own GNU-flavoured runtime below (the MSVC archive ld.lld
      # cannot consume), so this host-runtime build is Unix-only.
      - name: Build runtime library
        if: runner.os != 'Windows'
        run: cargo build -p ntsc-runtime --release

      - name: Build host runtime library (Windows)
        if: runner.os == 'Windows'
        run: cargo build -p ntsc-runtime --release

      - name: Build package manager
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = if ($IsWindows) { "ntsc.exe" } else { "ntsc" }
          $cli = Join-Path $pwd "target/release/$exe"
          Push-Location "crates/ntsc-pkg"
          try {
            & $cli build --release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }

      # ── Version ──────────────────────────────────────────────────────────
      # The tag is `v26.0.0b`; the MSI additionally needs a numeric
      # ProductVersion (26.0.0).
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "MSIVERSION=$(echo "$VERSION" | tr -cd '[:digit:].')" >> "$GITHUB_OUTPUT"

      # ── Linux: .deb, .rpm, PKGBUILD, portable .tar.gz ───────────────────
      - name: Package Linux installers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm patchelf
          bash .github/packaging/linux/build-deb-rpm.sh "${{ steps.version.outputs.VERSION }}"

      - name: Collect Arch PKGBUILD
        if: runner.os == 'Linux'
        run: |
          cp .github/packaging/linux/arch/PKGBUILD "PKGBUILD"

      - name: Build Linux tarball
        if: runner.os == 'Linux'
        run: bash .github/packaging/linux/make-tarball.sh "${{ steps.version.outputs.VERSION }}"

      # A .pkg.tar.zst that `sudo pacman -U` installs, produced by wrapping the
      # self-contained tarball (LLVM closure + runtime bundled) into a prebuilt
      # binary package. makepkg only runs on Arch and refuses to run as root,
      # and GitHub offers no Arch runner, so build it inside an archlinux
      # container as an unprivileged user. Must run after the tarball step,
      # whose output tree this package wraps.
      - name: Build Arch package
        if: runner.os == 'Linux'
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          docker run --rm -e VERSION -v "$PWD:/w" -w /w archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed base-devel
            mkdir -p /w/dist
            useradd -m builder
            chown -R builder:builder /w/dist
            su builder -c "bash .github/packaging/linux/make-arch-pkg.sh \"$VERSION\""
          '

      # ── macOS: .dmg, portable .tar.gz ────────────────────────────────────
      - name: Package macOS installer
        if: runner.os == 'macOS'
        run: bash .github/packaging/macos/make-dmg.sh "${{ steps.version.outputs.VERSION }}"

      - name: Build macOS tarball
        if: runner.os == 'macOS'
        run: bash .github/packaging/macos/make-tarball.sh "${{ steps.version.outputs.VERSION }}"

      # ── Windows: .msi ────────────────────────────────────────────────────
      # The MSI bundles ld.lld + the GNU-flavoured runtime so `ntsc build`
      # links without MSVC or gcc. ring needs NASM to build for the
      # x86_64-pc-windows-gnu target.
      - name: Build GNU runtime for the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup target add x86_64-pc-windows-gnu
          choco install nasm -y --no-progress
          cargo build -p ntsc-runtime --target x86_64-pc-windows-gnu --release

      - name: Set up .NET SDK
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # build-msi.ps1 shells out to `wix` and `wix build -ext
      # WixToolset.UI.wixext`. The WiX v4+ CLI ships as a .NET global tool and
      # its extensions must be registered before use, so install both. The
      # global-tools dir is added to PATH in the packaging step below.
      - name: Install WiX toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version ${{ env.WIX_VERSION }}
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix extension add --global WixToolset.UI.wixext/${{ env.WIX_VERSION }}
          wix --version

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          pwsh .github/packaging/windows/build-msi.ps1 -Version "${{ steps.version.outputs.VERSION }}" -MsiVersion "${{ steps.version.outputs.MSIVERSION }}" -GnuRuntimeLib "target\x86_64-pc-windows-gnu\release\libntsc_runtime.a" -LlvmBin "$env:LLVM_BIN"

      # Reuses the self-contained tree build-msi.ps1 staged at dist\win, so it
      # must run after the MSI step.
      - name: Build Windows tarball
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh .github/packaging/windows/make-tarball.ps1 -Version "${{ steps.version.outputs.VERSION }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-installers
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
