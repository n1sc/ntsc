name: Build Windows Release Bundle

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    name: Build Windows Release Bundle
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      LLVM_VERSION: 23.1.3

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 23 (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-${{ env.LLVM_VERSION }}/clang+llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc.tar.xz" -OutFile llvm.tar.xz
          tar -xf llvm.tar.xz
          Remove-Item llvm.tar.xz
          $llvm = Join-Path $pwd "clang+llvm-${{ env.LLVM_VERSION }}-x86_64-pc-windows-msvc"
          "LLVM_SYS_231_PREFIX=$llvm" >> $env:GITHUB_ENV
          "LLVM_BIN=$llvm\bin" >> $env:GITHUB_ENV
          "$llvm\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, x86_64-pc-windows-gnu

      - name: Build ntsc and runtime
        shell: pwsh
        run: |
          cargo build -p ntsc-cli --release
          cargo build -p ntsc-runtime --release
          cargo build -p ntsc-runtime --target x86_64-pc-windows-gnu --release

      - name: Compile Benchmark Comparison Binaries
        shell: pwsh
        run: |
          $dist = "dist/ntsc-windows"
          $prebuiltDir = "$dist/prebuilt"
          New-Item -ItemType Directory -Force -Path $prebuiltDir | Out-Null
          
          # 1. Rust
          rustc --edition=2024 -C opt-level=3 -C codegen-units=1 -C panic=abort benchmarks/hard/kernels.rs -o "$prebuiltDir/rust.exe"
          
          # 2. Go
          go build -trimpath -o "$prebuiltDir/go.exe" benchmarks/hard/kernels.go
          
          # 3. Clang
          clang -O3 -std=c11 -ffp-contract=off benchmarks/hard/kernels.c -o "$prebuiltDir/clang.exe"
          
          # 4. GCC (if available)
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            gcc -O3 -std=c11 -ffp-contract=off benchmarks/hard/kernels.c -lm -o "$prebuiltDir/gcc.exe"
          }
          
          $versions = @{
            "C · Clang" = (clang --version | Select-Object -First 1)
            "Go" = (go version)
            "Rust" = (rustc --version)
          }
          if (Get-Command gcc -ErrorAction SilentlyContinue) {
            $versions["C · GCC"] = (gcc --version | Select-Object -First 1)
          }
          $versions | ConvertTo-Json | Set-Content "$prebuiltDir/versions.json"

      - name: Stage Self-Contained Bundle
        shell: pwsh
        run: |
          $dist = "dist/ntsc-windows"
          Copy-Item "target/release/ntsc.exe" $dist/
          Copy-Item "target/x86_64-pc-windows-gnu/release/libntsc_runtime.a" $dist/
          Copy-Item "$env:LLVM_BIN/LLVM-C.dll" $dist/
          if (Test-Path "$env:LLVM_BIN/ld.lld.exe") { Copy-Item "$env:LLVM_BIN/ld.lld.exe" $dist/ }
          
          $rustcSysroot = (rustc --print sysroot)
          $rustcLib = Join-Path $rustcSysroot "lib\rustlib\x86_64-pc-windows-gnu\lib"
          $mingwSources = @(
            "C:\Strawberry\c\x86_64-w64-mingw32\lib",
            "C:\ProgramData\Chocolatey\lib\mingw\tools\install\mingw64\x86_64-w64-mingw32\lib",
            $rustcLib
          )
          $mingwDir = "$dist/mingw"
          New-Item -ItemType Directory -Force -Path $mingwDir | Out-Null
          foreach ($src in $mingwSources) {
            if (Test-Path $src) {
              Copy-Item "$src\crt2.o" $mingwDir/ -ErrorAction SilentlyContinue
              Copy-Item "$src\crtbegin.o" $mingwDir/ -ErrorAction SilentlyContinue
              Copy-Item "$src\crtend.o" $mingwDir/ -ErrorAction SilentlyContinue
              Copy-Item "$src\libgcc*.a" $mingwDir/ -ErrorAction SilentlyContinue
              Copy-Item "$src\libsynchronization.a" $mingwDir/ -ErrorAction SilentlyContinue
              Copy-Item "$src\libmingw*.a" $mingwDir/ -ErrorAction SilentlyContinue
              Copy-Item "$src\libmsvcrt.a" $mingwDir/ -ErrorAction SilentlyContinue
            }
          }
          Push-Location $dist
          7z a -tzip -mx=9 "../../dist/ntsc-windows-x86_64.zip" *
          Pop-Location

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ntsc-windows-x86_64
          path: dist/ntsc-windows-x86_64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/ntsc-windows-x86_64.zip
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
